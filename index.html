
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RightOn - Your independent digital concierge.">
    <title>RightOn | Your Digital Concierge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">RightOn<span>.</span></div>
        <div class="brand-name">THE WRIGHT OF WAY</div>
    </header>

    <main class="main-content">

        <section class="welcome">
            <h1>What do you need?</h1>

            <p>
                Tell RightOn what you're looking for.
                We'll help you figure out the rest.
            </p>

            <form id="request-form">

                <textarea
                    id="user-request"
                    placeholder="Describe what you need..."
                    required
                ></textarea>

                <button type="submit">Let's Go →</button>

            </form>

            <p class="tagline">
                Simple to use. Sophisticated behind the scenes.
            </p>

        </section>

    </main>

    <footer class="footer">
        <p>RightOn © 2026</p>
        <p>Powered by The Wright of Way</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
